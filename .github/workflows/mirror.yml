name: Mirror SyncYomi to Docker Hub
on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 04:00 UTC
  workflow_dispatch:    # Lets you click "Run workflow" manually anytime

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull from GHCR and Push to Docker Hub
        run: |
          docker pull ghcr.io/syncyomi/syncyomi:latest
          docker tag ghcr.io/syncyomi/syncyomi:latest ${{ secrets.DOCKERHUB_USERNAME }}/syncyomi:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/syncyomi:latest
